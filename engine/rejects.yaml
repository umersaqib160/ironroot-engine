# Scenes rejected at review. The planner drops these before it picks a month,
# so a rejected scene is never scheduled and never paid for again.
#
# A scene is listed here when the IMAGE is wrong in a way the scene wording
# caused or cannot avoid. If a scene is sound and only one generation went bad,
# delete the file and let it regenerate instead of listing it here.
#
# Add: id, who rejected it, the date, and what was actually wrong — a reason you
# can check later beats a reason you have to trust.

