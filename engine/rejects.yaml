  - id: p4_meal_prep
    by: Umer
    date: 2026-09-24
    reason: >
      came back as a rendered Instagram screenshot — status bar, wordmark,
      username, like and comment icons, carousel dots, caption, nav bar. The
      scene puts the pan among a wide flat-lay of props, which is exactly the
      composition the model associates with a feed post.

  - id: p2_couple_cooking
    by: Claude
    date: 2026-09-24
    reason: >
      a black non-stick pan sits on the next burner beside ours. The same month
      runs an education card saying non-stick pans carry PFAS, so our own photo
      argues against us. Two people cooking together invites a second burner in
      frame; generate.py now says the pan is the only pan in the picture, and
      this scene can come back once a clean generation proves it.

  - id: p4_window_light
    by: Claude
    date: 2026-09-24
    reason: >
      rolled rim lip standing proud of the wall all the way round, and a shallow
      bowl-shaped body. An empty pan alone on a counter gives the model nothing
      to anchor the shape to, so it invents one.
