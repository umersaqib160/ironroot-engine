# Scene library — the ONLY part of the prompt that varies.
#
# The prompt has a fixed skeleton and one variable slot:
#
#   FIXED   "Use the image from the frying pan and create an image for {platform} where"
#   VARY    <scene>
#   VARY    "The setting of the home is <mood>."
#   FIXED   "Make sure the pan is not too deep and has no lip ring."
#   FIXED   the reference photograph
#
# Nothing above the scene list may be edited casually. That skeleton took five
# failed generations to find; the scene text is where all variety lives.
#
# subject: person   -> a human in frame. Lifestyle context only, never speaking
#                      as a customer, platform AI label ON at posting.
#          pan_only -> no people. No AI label needed for a human likeness, but
#                      the label still applies to any AI-edited asset.
#
# pillar:  1 = education (40% of posts) — DEMONSTRATIONS only, see below
#          2 = product in action (30% of posts)
#          4 = lifestyle / brand  (15% of posts)
#
# What must never be generated, and is therefore absent from this file:
#   - claim cards, cost maths, text overlays  -> built in code (zero drift risk)
#   - social proof / review cards (pillar 3)  -> real reviews on real photographs
#   - any physics demonstration               -> real footage or not at all
# An education DEMONSTRATION — someone doing a thing that proves a point — is a
# normal generated scene carrying its message in the caption. The rule was never
# "education cannot be generated"; it is "claims and quotes are not drawn".

# Moods. REBALANCED 3 Sep 2026 after Umer's note that the output had drifted
# gloomy: every mood in the first list was a dark one, so every image was dark.
# Cozy was doing the work, but with nothing bright to sit against it read as
# grim rather than warm.
#
# tone: light | warm | evening — the picker guarantees a mix, so a week can
# never come out all-dark again. Keep roughly two-thirds light or warm.
moods:
  - text: bright and airy, morning sun coming through the window
    tone: light
  - text: full of daylight, fresh and clean
    tone: light
  - text: sunlit and lively, a busy family kitchen
    tone: light
  - text: warm afternoon light, relaxed and unhurried
    tone: warm
  - text: warm and lived-in, golden light across the counter
    tone: warm
  - text: warm and inviting, soft daylight and good colour
    tone: warm
  - text: cozy evening with warm lamplight
    tone: evening
  - text: dim light but cozy
    tone: evening

