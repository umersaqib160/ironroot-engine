  # ---------------- Benefit demonstrations (Umer, 3 Sep 2026) --------------
  # These carry a specific selling message, so each one also carries the claim
  # it supports and — where it matters — what the caption must NOT say.
  # Verified against the live product page and the real reviews before adding.

  - id: bd_dishwasher
    pillar: 2
    subject: person
    text: a chef is putting the pan into the dishwasher at home
    claim: dishwasher safe
    claim_source: >
      Product SEO description: "oven-safe to 500F, dishwasher safe".
      Bundle description: "oven and dishwasher friendly". SUBSTANTIATED.

  - id: bd_easy_clean
    pillar: 2
    subject: person
    text: a chef is rinsing the pan clean under the tap after cooking
    claim: easy to clean
    claim_source: >
      Real verified reviews: Magnus B "schoonmaken is een fluitje van een cent";
      Jeroen K "De pan is makkelijk schoon te maken". SUBSTANTIATED.
    note: >
      Umer originally proposed "cleaning the pan with a metal sponge". Changed
      deliberately. A metal scourer on a satin finish scratches it, which fights
      the buy-it-for-life message and invites "it dulled my pan" complaints.
      The reviews say easy, not abrasive. If the intent is specifically to show
      the pan survives scrubbing, that is a DURABILITY message and belongs in a
      pillar-1 education post, not a lifestyle still.

  - id: bd_eggs_release
    on_heat: true
    pillar: 2
    subject: person
    text: a chef is frying eggs in the pan
    claim: food releases cleanly with the right technique
    claim_source: >
      Real verified review, Lotte M: "Ik kan nu eindelijk gerechten perfect
      braden zonder aanbranden" (finally fry perfectly without sticking).
      The July education post already frames this as technique: preheat empty,
      then the fat, then the food.
    caption_never: >
      NEVER say the pan is "non-stick" or "no-stick". Bare stainless is not
      non-stick and the product page never claims it. The whole positioning is
      "no chemical coatings" — a non-stick claim contradicts it, the
      stainless-literate audience will call it out, and it guarantees refund
      requests from customers whose eggs stick because they did not preheat.
    caption_must: >
      Frame it as TECHNIQUE, which is a stronger message anyway: preheat the
      empty pan, then the fat, then the food, and eggs release cleanly with no
      coating involved.

  - id: ed_oven_transfer
    pillar: 1
    subject: person
    text: a chef is sliding the pan into a hot oven to finish the dish
    claim: oven safe to 500F
    claim_source: 'Product SEO description: "oven-safe to 500F".'
    caption_must: >
      Hob to oven, same pan, no swapping dishes halfway through. This is what
      tri-ply stainless does that a coated pan cannot.

  - id: ed_induction_hob
    on_heat: true
    pillar: 1
    subject: pan_only
    text: the pan sits on a black induction hob with the control display lit, no people in frame
    claim: works on every cooktop including induction
    claim_source: >
      Product title tag "PFAS-Free, Tri-Ply, All Cooktops"; real review
      (Jeroen K) "suitable for all cooktops".
    qc_watch: >
      Induction hobs are flat black glass with cross or plus zone markings only.
      Reject any coil graphics or glowing rings.

  - id: ed_searing_crust
    on_heat: true
    pillar: 1
    subject: person
    text: a chef is pressing a steak into the hot pan and it is building a deep brown crust
    claim: tri-ply stainless holds heat and sears properly
    claim_source: >
      Product description "premium tri-ply stainless steel"; real reviews
      (Sofie V, Thomas R) on even heating.
    caption_must: >
      Frame as what stainless is FOR — a real crust, which a coated pan at safe
      temperature cannot give you.

  - id: ed_dishwasher_load
    pillar: 1
    subject: person
    text: a chef is loading the pan into an open dishwasher in a home kitchen
    claim: dishwasher safe
    claim_source: >
      Product SEO description "dishwasher safe"; bundle description "oven and
      dishwasher friendly". SUBSTANTIATED.
    caption_must: >
      The reason it survives the dishwasher is the reason it survives a scourer:
      there is no coating to destroy.

  - id: bd_durability_scrub
    pillar: 1
    subject: person
    text: a chef is scrubbing the inside of the pan hard with a metal scouring pad at the sink
    claim: there is no coating to ruin, so it can be scrubbed
    claim_source: >
      Product description: "free of chemical coatings", "premium tri-ply
      stainless steel". The absence of a coating is the product's core fact, so
      the durability that follows from it is substantiated by construction.
    caption_must: >
      Lead with the CONTRAST, which is where the force is: do this to a non-stick
      pan and you have destroyed it. Bare stainless has nothing to scratch off,
      so a stuck-on mess is a scrub, not a replacement. This is the
      buy-it-for-life argument made concrete.
    caption_never: >
      Do not present this as routine daily cleaning — for that use bd_easy_clean.
      This scene exists to show what the pan SURVIVES, not how it is normally
      washed.
    qc_watch: >
      Check the finish still reads as clean satin stainless. If the model renders
      the pan as scratched, gouged or dulled, REJECT — the image would argue
      against the product instead of for it.

# Look and feel — Umer, 3 Sep 2026
#
# Cozy and inviting, NOT gloomy. Warm and full of life: real colour in the food,
# daylight where it fits, a kitchen someone actually lives in. Deep moody shadow
# was the July direction and it has been retired — it made the pan look like it
# lived in a cave, and it flattened the food.
#
# The dish. Rotated across a month and checked so no two consecutive posts show
# the same food — Umer, 6 Sep 2026. Nothing controlled this before: the model
# chose, and it kept choosing the same potatoes.
#
# This is a scene detail, appended like any other. It never describes the pan.
dishes:
  - salmon fillets
  - a steak
  - eggs
  - mixed vegetables
  - chicken and vegetables
  - a whole one-pan dinner
  - nothing, the pan is empty and clean

# Props to avoid — learned from real generations, not theory.
avoid:
  - books, magazines, packaging or signage with visible text (the model fakes
    lettering and mangled text is an instant AI tell — seen 3 Sep)
  - other frying pans in shot (brand confusion, and a second pan invites a
    second handle)
  - copper cookware (reads as a different product category)
