# The Monday run — Phase 4 / test stage T1.
#
# Generates the week's images and opens an approval Issue. PUBLISHES NOTHING.
# There is no auto-approve and no timer: if Umer never comments, nothing happens.
#
# Kill switch: create a file named engine/HALT (any contents) and the run stops
# before spending anything. Delete it to resume.

name: Weekly content run

# SCHEDULE DISABLED 24 Sep 2026, at Umer's request.
#
# The weekly run worked — it fired unattended on 7, 14 and 21 September and
# produced nine images. But the project has moved to monthly batches
# (automation/monthly_plan.md), and leaving this armed would mean two schedules
# generating content and two sets of approval issues competing for attention.
#
# Kept rather than deleted: it is still the only end-to-end path that has
# actually run, so it stays available by hand while the monthly run is built and
# proven. Restore the schedule by uncommenting the two lines below.
#
# Known bug, not worth fixing here: the weekly picker can choose the same scene
# twice in one batch — it did on 31 August. The monthly picker cannot, because it
# chooses the whole set up front.

on:
  # schedule:
  #   - cron: "0 6 * * 1"     # 06:00 UTC Monday
  workflow_dispatch:
    inputs:
      count:
        description: "How many images"
        required: true
        default: "3"
      size:
        description: "Master resolution"
        required: true
        default: "2K"
        type: choice
        options: ["1K", "2K", "4K"]

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-run
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Kill switch
        run: |
          if [ -f engine/HALT ]; then
            echo "::warning::engine/HALT present — the engine is stopped."
            echo "HALTED=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v6
        if: env.HALTED != '1'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: env.HALTED != '1'
        run: pip install --quiet requests pillow pyyaml

      - name: Validate arguments (no API call)
        if: env.HALTED != '1'
        run: python engine/generate.py --scene "smoke test" --out /dev/null --dry-run

      - name: Generate the week
        if: env.HALTED != '1'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional. Without it the run still produces images and the Issue;
          # captions are left as a skeleton rather than failing the week.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python engine/run_week.py \
            --count    "${{ inputs.count || '3' }}" \
            --size     "${{ inputs.size || '2K' }}" \
            --repo     "${{ github.repository }}" \
            --sha      "${{ github.sha }}" \
            --run-url  "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --out-issue issue_body.md

      - name: Commit the bundle
        if: env.HALTED != '1'
        run: |
          git config user.name  "ironroot-engine"
          git config user.email "noreply@ironrootstore.com"
          # NOT -f. The ignore file already whitelists the small platform
          # exports, captions.md and bundle.json; -f would override it for the
          # whole tree and drag in the multi-MB masters (it did, on 3 Sep).
          git add content/weekly engine/scene_history.json
          git commit -m "Weekly bundle $(date +%Y-%m-%d) [skip ci]" || {
            echo "nothing to commit"; exit 0; }
          git push

      # Labels must exist before they can be applied. Creating them here rather
      # than by hand keeps the repo self-setting-up: a fresh clone works.
      - name: Ensure labels exist
        if: env.HALTED != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create approval --color FBCA04 \
            --description "Awaiting Umer's decision" --force
          gh label create approved --color 0E8A16 \
            --description "Approved by Umer" --force
          gh label create redo      --color D93F0B \
            --description "Rework requested" --force

      - name: Open the approval issue
        if: env.HALTED != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Approve: week of $(date +%Y-%m-%d)" \
            --body-file issue_body.md \
            --label approval

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # Scoped to THIS run's folder. It used to be content/weekly/, which
          # uploaded every previous week too — every zip contained every folder
          # that had ever been made, which is what made the downloads confusing.
          name: weekly-${{ env.BUNDLE_DIR && 'bundle' || 'partial' }}
          path: ${{ env.BUNDLE_DIR || 'content/weekly' }}
          retention-days: 30
          if-no-files-found: ignore
