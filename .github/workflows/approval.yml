# Approval capture.
#
# Phase 4 stops here: it records the decision and labels the Issue. Publishing is
# Phase 5 and is deliberately not wired yet — the T1 stage exists to prove the
# loop works before anything can reach a public account.
#
# Only the repository owner's comments count. A comment from anyone else is
# ignored, so a stray reply can never approve a week's content.

name: Approval

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  record:
    if: |
      github.event.issue.state == 'open' &&
      startsWith(github.event.issue.title, 'Approve:') &&
      github.event.comment.user.login == github.event.repository.owner.login
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read the decision
        id: read
        env:
          BODY: ${{ github.event.comment.body }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          python3 engine/parse_comment.py --github >> "$GITHUB_OUTPUT"
          echo "week=$(echo "$TITLE" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)" >> "$GITHUB_OUTPUT"
          echo "--- understood as ---"
          python3 engine/parse_comment.py

      - name: Approved
        if: steps.read.outputs.decision == 'approve'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create approved --color 0E8A16 --force || true
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" --add-label approved || true
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "Approved and recorded. Publishing is not connected yet (Phase 5), so nothing has been posted."

      - name: Out of range
        if: steps.read.outputs.decision == 'bad_index'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "There is no image ${{ steps.read.outputs.index }} this week. Reply with a number that exists, or just say what to change and I will redo them all."

      - uses: actions/setup-python@v6
        if: steps.read.outputs.decision == 'redo'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.read.outputs.decision == 'redo'
        run: pip install --quiet requests pillow pyyaml

      - name: Acknowledge before spending anything
        if: steps.read.outputs.decision == 'redo'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "On it — redoing ${{ steps.read.outputs.index && format('image {0}', steps.read.outputs.index) || 'all images' }}. Change: *${{ steps.read.outputs.note || 'none, re-rolling the same scene' }}*. This takes a couple of minutes."

      - name: Regenerate
        if: steps.read.outputs.decision == 'redo'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEEK: ${{ steps.read.outputs.week }}
          IDX: ${{ steps.read.outputs.index }}
          NOTE: ${{ steps.read.outputs.note }}
        run: |
          set -e
          : > redo_comment_all.md
          if [ -n "$IDX" ]; then
            TARGETS="$IDX"
          else
            # No image named — apply the note to every image in the bundle.
            TARGETS=$(python3 -c "import json,sys; print(' '.join(str(p['index']) for p in json.load(open(f'content/weekly/$WEEK/bundle.json'))['posts']))")
          fi
          echo "redoing image(s): $TARGETS"
          for i in $TARGETS; do
            python3 engine/redo_one.py --week "$WEEK" --index "$i" --note "$NOTE"
            cat redo_comment.md >> redo_comment_all.md
            printf '\n\n---\n\n' >> redo_comment_all.md
          done

      - name: Commit and report back
        if: steps.read.outputs.decision == 'redo'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "ironroot-engine"
          git config user.email "noreply@ironrootstore.com"
          git add content/weekly
          git commit -m "Redo week ${{ steps.read.outputs.week }} [skip ci]" || true
          git push || true
          gh label create redo --color D93F0B --force || true
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" --add-label redo || true
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" --body-file redo_comment_all.md

      - name: Say what went wrong
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "That did not work — [see the run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Nothing was changed. Try again, or say it differently."
